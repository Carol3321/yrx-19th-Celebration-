<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生日快乐 · 19岁</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>">
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#0B1026;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif; -webkit-tap-highlight-color:transparent; }
  #c { display:block; width:100%; height:100%; }
  #replay {
    position:fixed; left:50%; bottom:36px; transform:translateX(-50%);
    padding:10px 26px; border-radius:999px; border:1px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.08); color:#fff; font-size:14px; letter-spacing:2px;
    cursor:pointer; backdrop-filter:blur(8px); opacity:0; transition:opacity .4s; pointer-events:none; z-index:20;
  }
  #replay.show { opacity:1; pointer-events:auto; }
  #replay:active { background:rgba(255,255,255,.2); }
  #ageModal {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(11,16,38,.85); backdrop-filter:blur(6px); z-index:30;
  }
  #ageModal .box {
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2);
    border-radius:20px; padding:36px 44px; text-align:center; color:#fff;
  }
  #ageModal h2 { margin:0 0 20px; font-size:22px; font-weight:600; letter-spacing:1px; }
  #ageModal input {
    width:120px; padding:10px 14px; font-size:22px; text-align:center;
    border-radius:12px; border:1px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.1); color:#fff; outline:none;
  }
  #ageModal button {
    display:block; margin:20px auto 0; padding:10px 40px; font-size:16px; letter-spacing:2px;
    border-radius:999px; border:none; cursor:pointer;
    background:linear-gradient(135deg,#FF69B4,#FF8FA3); color:#fff;
  }
  /* 全屏文字叠加层：绝对平行于屏幕 */
  .overlay-text {
    position:fixed; left:50%; top:42%; transform:translate(-50%,-50%);
    font-weight:900; letter-spacing:4px; z-index:10;
    opacity:0; pointer-events:none; white-space:nowrap;
  }
  #countdown { font-size:140px; }
  #hbd { font-size:72px; color:#FF69B4;
    text-shadow:0 0 30px #FF69B4, 0 0 60px #FF69B4, 0 0 90px #FF1493; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="countdown" class="overlay-text"></div>
<div id="hbd" class="overlay-text">Happy Birthday</div>
<button id="replay">再看一次</button>
<div id="ageModal">
  <div class="box">
    <h2>你今天几岁啦？</h2>
    <input id="ageInput" type="number" value="19" min="1" max="120">
    <button id="startBtn">开始庆祝</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:false});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0B1026);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(9.0, 5.5, 10.0);
camera.lookAt(0, 1.8, 0);

// 背景星星
{
  const n=800, pos=new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const th=Math.random()*Math.PI*2, ph=Math.acos(Math.random()*2-1), r=20+Math.random()*15;
    pos[i*3]=r*Math.sin(ph)*Math.cos(th);
    pos[i*3+1]=r*Math.cos(ph)*0.6+3;
    pos[i*3+2]=r*Math.sin(ph)*Math.sin(th);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({color:0x8888aa, size:0.03, transparent:true, opacity:0.6})));
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function hexRgb(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function lighter(h, a=0.5){ const c=hexRgb(h); return c.map(v=>Math.round(v+(255-v)*a)); }
function rand(a,b){ return a + Math.random()*(b-a); }

function sampleCyl(cx,cy,cz,r,h,ns=3000,nt=1000){
  const p=[];
  for(let i=0;i<ns;i++){ const th=Math.random()*Math.PI*2, z=Math.random()*h;
    p.push(cx+r*Math.cos(th), cy+r*Math.sin(th), cz+z); }
  for(let i=0;i<nt;i++){ const th=Math.random()*Math.PI*2, rr=r*Math.sqrt(Math.random());
    p.push(cx+rr*Math.cos(th), cy+rr*Math.sin(th), cz+h+(Math.random()-0.5)*0.004); }
  return new Float32Array(p);
}
function sampleBalls(cx,cy,cz,R,n=26,per=80){
  const p=[];
  for(let i=0;i<n;i++){
    const ang=2*Math.PI*(i+0.5)/n;
    const bx=cx+R*Math.cos(ang), by=cy+R*Math.sin(ang), bz=cz-0.05;
    for(let j=0;j<per;j++){
      const u=Math.random()*Math.PI*2, v=Math.acos(2*Math.random()-1);
      p.push(bx+0.10*Math.sin(v)*Math.cos(u), by+0.10*Math.sin(v)*Math.sin(u), bz+0.10*Math.cos(v));
    }
  }
  return new Float32Array(p);
}
function sampleFlame(cx,cy,cz,h,mr,n=2500){
  const p=[];
  for(let i=0;i<n;i++){
    const t=Math.random();
    const r=mr*Math.sin(Math.PI*Math.pow(t,0.45))*(1-0.75*t)*Math.sqrt(Math.random());
    const th=Math.random()*Math.PI*2;
    p.push(cx+r*Math.cos(th), cy+r*Math.sin(th), cz+t*h);
  }
  return new Float32Array(p);
}
function sampleText(str, worldW=5, fsize=200){
  const pad=40, c=document.createElement('canvas'), ctx=c.getContext('2d');
  ctx.font=`bold ${fsize}px "Comic Sans MS","Microsoft YaHei",sans-serif`;
  const w=Math.ceil(ctx.measureText(str).width)+pad*2, h=fsize+pad*2;
  c.width=w; c.height=h;
  ctx.font=`bold ${fsize}px "Comic Sans MS","Microsoft YaHei",sans-serif`;
  ctx.fillStyle='#fff'; ctx.textBaseline='middle';
  ctx.fillText(str, pad, h/2);
  const img=ctx.getImageData(0,0,w,h).data, pts=[], step=3;
  for(let y=0;y<h;y+=step) for(let x=0;x<w;x+=step)
    if(img[(y*w+x)*4+3]>128) pts.push([(x-w/2), (h/2-y)]);
  const sc=worldW/w, out=[];
  for(let k=0;k<3;k++){ const zz=(k-1)*0.04; for(const p of pts) out.push(p[0]*sc, p[1]*sc, zz); }
  return new Float32Array(out);
}

const cakeGroup = new THREE.Group();
cakeGroup.rotation.x = -Math.PI/2;
scene.add(cakeGroup);
const overlayGroup = new THREE.Group();
overlayGroup.rotation.x = -Math.PI/2;
scene.add(overlayGroup);

// 盘子
{
  const n=3000, p=[];
  for(let i=0;i<n;i++){ const th=Math.random()*Math.PI*2, rr=Math.sqrt(Math.random())*2.35;
    p.push(rr*Math.cos(th), rr*Math.sin(th), -0.05+(Math.random()-0.5)*0.01); }
  const g=new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(p,3));
  cakeGroup.add(new THREE.Points(g, new THREE.PointsMaterial({color:0xE7DCF2, size:0.045})));
}
// 五层蛋糕
const layers=[[1.90,0.85,"#FFB3C6"],[1.62,0.78,"#FFE7A8"],[1.36,0.72,"#A8E6CF"],[1.12,0.66,"#A9C9FF"],[0.88,0.60,"#D9BFFF"]];
let z=0;
for(const [r,h,col] of layers){
  const g=new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(sampleCyl(0,0,z,r,h),3));
  cakeGroup.add(new THREE.Points(g, new THREE.PointsMaterial({color:new THREE.Color(col), size:0.05})));
  const gb=new THREE.BufferGeometry(); gb.setAttribute('position', new THREE.BufferAttribute(sampleBalls(0,0,z+h,r*1.03),3));
  cakeGroup.add(new THREE.Points(gb, new THREE.PointsMaterial({color:new THREE.Color(`rgb(${lighter(col,0.55).join(',')})`), size:0.05})));
  z+=h;
}
const tz=z;

// 数字蜡烛
let numCandle;
function buildCandle(age){
  if(numCandle){ cakeGroup.remove(numCandle); numCandle.geometry.dispose(); numCandle.material.dispose(); }
  const pts=sampleText(String(age),1.8,240);
  const g=new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pts,3));
  numCandle=new THREE.Points(g, new THREE.PointsMaterial({color:0xFF8FA3, size:0.06}));
  numCandle.rotation.x=Math.PI/2; numCandle.position.z=tz+0.5;
  cakeGroup.add(numCandle);
}

// 火焰
let flameOuter, flameInner;
const fz=tz+1.05;
{
  const g=new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(sampleFlame(0,0,fz,0.35,0.08,3000),3));
  flameOuter=new THREE.Points(g, new THREE.PointsMaterial({color:0xFF4A0F, size:0.05}));
  overlayGroup.add(flameOuter);
  const g2=new THREE.BufferGeometry(); g2.setAttribute('position', new THREE.BufferAttribute(sampleFlame(0,0,fz+0.008,0.25,0.045,2200),3));
  flameInner=new THREE.Points(g2, new THREE.PointsMaterial({color:0xFFE9A8, size:0.05}));
  overlayGroup.add(flameInner);
}

// 顶层糖珠
{
  const SPCOL=["#FF8FA3","#7EC8E3","#FFC857","#9AE6B4","#C79BFF","#FFFFFF"];
  const n=30*40, pos=new Float32Array(n*3), col=new Float32Array(n*3);
  const tr=layers[4][0]*1.03;
  for(let i=0;i<n;i++){
    const rad=tr*Math.sqrt(Math.random())*0.92, ang=Math.random()*Math.PI*2;
    pos[i*3]=rad*Math.cos(ang); pos[i*3+1]=rad*Math.sin(ang); pos[i*3+2]=tz+0.02;
    const c=hexRgb(SPCOL[Math.floor(Math.random()*SPCOL.length)]);
    col[i*3]=c[0]; col[i*3+1]=c[1]; col[i*3+2]=c[2];
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('color', new THREE.BufferAttribute(col,3));
  cakeGroup.add(new THREE.Points(g, new THREE.PointsMaterial({size:0.04, vertexColors:true})));
}
cakeGroup.visible=false;
flameOuter.visible=false;
flameInner.visible=false;

// 飘带
const RPAL=[0xFF1744,0xFF6D00,0xFFD600,0x76FF03,0x00E5FF,0x2979FF,0xAA00FF,0xF50057,
            0x00E676,0xFF9100,0xFF4081,0x18FFFF,0xFFFF00,0xFF6E40,0xB388FF,0x69F0AE];
const ribbons=[], NB=120;
for(let i=0;i<NB;i++){
  const L=rand(0.7,1.2), W=rand(0.10,0.16);
  const verts=new Float32Array([-W/2,0,0, W/2,0,0, -W/2,0,-L, W/2,0,-L]);
  const g=new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(verts,3));
  const mesh=new THREE.Mesh(g, new THREE.MeshBasicMaterial({color:RPAL[Math.floor(Math.random()*RPAL.length)], side:THREE.DoubleSide}));
  mesh.visible=false; overlayGroup.add(mesh);
  ribbons.push({mesh, pos:new THREE.Vector3(0,0,3), vel:new THREE.Vector3(), ang:new THREE.Euler(),
    angVel:new THREE.Vector3(rand(-0.15,0.15),rand(-0.15,0.15),rand(-0.15,0.15)), born:-1});
}
// 小彩带
const NC=400, CPAL=[0xFF6B9D,0xFFD93D,0x6BCBFF,0xA0E76E,0xC78CFF,0xFF9A6B,0xFF1744,0x00E5FF];
const cfGeo=new THREE.BufferGeometry();
const cfPos=new Float32Array(NC*3), cfCol=new Float32Array(NC*3), cfVel=new Float32Array(NC*3);
function resetCF(){
  for(let i=0;i<NC;i++){
    cfPos[i*3]=rand(-5,5); cfPos[i*3+1]=rand(-5,5); cfPos[i*3+2]=rand(-2,10);
    cfVel[i*3]=rand(-0.01,0.01); cfVel[i*3+1]=rand(-0.01,0.01); cfVel[i*3+2]=-rand(0.015,0.04);
    const c=new THREE.Color(CPAL[Math.floor(Math.random()*CPAL.length)]);
    cfCol[i*3]=c.r*255; cfCol[i*3+1]=c.g*255; cfCol[i*3+2]=c.b*255;
  }
}
resetCF();
cfGeo.setAttribute('position', new THREE.BufferAttribute(cfPos,3));
cfGeo.setAttribute('color', new THREE.BufferAttribute(cfCol,3));
const confetti=new THREE.Points(cfGeo, new THREE.PointsMaterial({size:0.08, vertexColors:true}));
confetti.visible=false; overlayGroup.add(confetti);

// DOM 文字元素
const cdEl=document.getElementById('countdown');
const hbEl=document.getElementById('hbd');
const CDCOLORS={3:'#F50057',2:'#FF9100',1:'#00E676'};

// 时间线
const SPN=140, CD0=3;
const CDEND=CD0*SPN;
const HBPOP=CDEND+120, HBHOLD=CDEND+480, HBFADE=CDEND+700, CAKEF=CDEND+800;
const GRAV=0.004;
let fc=0, ROT=false, FALL=false, BSTART=false, curN=null, nf=0, started=false;

function resetAll(){
  fc=0; ROT=false; FALL=false; BSTART=false; curN=null;
  cdEl.style.opacity=0; hbEl.style.opacity=0; hbEl.style.transform='translate(-50%,-50%) scale(1)';
  cakeGroup.visible=false; cakeGroup.rotation.z=0;
  flameOuter.visible=false; flameInner.visible=false;
  for(const r of ribbons){ r.mesh.visible=false; r.born=-1; }
  confetti.visible=false; resetCF(); cfGeo.attributes.position.needsUpdate=true;
  document.getElementById('replay').classList.remove('show');
}
document.getElementById('replay').addEventListener('click', resetAll);

function playBGM(){
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const notes=[
    [261.63,0.75],[261.63,0.25],[293.66,1],[261.63,1],[349.23,1],[329.63,2],
    [261.63,0.75],[261.63,0.25],[293.66,1],[261.63,1],[392.00,1],[349.23,2],
    [261.63,0.75],[261.63,0.25],[523.25,1],[440.00,1],[349.23,1],[329.63,1],[293.66,2],
    [466.16,0.75],[466.16,0.25],[440.00,1],[349.23,1],[392.00,1],[349.23,3]
  ];
  const beat=0.45;
  let t=ctx.currentTime+0.1;
  for(const [freq, beats] of notes){
    const dur=beats*beat;
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.type='sine'; osc.frequency.value=freq;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.3, t+0.05);
    gain.gain.linearRampToValueAtTime(0.25, t+dur-0.1);
    gain.gain.linearRampToValueAtTime(0, t+dur);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t); osc.stop(t+dur);
    t+=dur;
  }
}

document.getElementById('startBtn').addEventListener('click', () => {
  const age = parseInt(document.getElementById('ageInput').value) || 19;
  buildCandle(age);
  document.getElementById('ageModal').style.display='none';
  started = true;
  playBGM();
  resetAll();
});

function animate(){
  requestAnimationFrame(animate);
  if(!started){ renderer.render(scene,camera); return; }
  fc++;
  // 倒数
  if(fc<CDEND){
    const cur=CD0-Math.floor(fc/SPN);
    if(cur!==curN){
      curN=cur; nf=fc;
      cdEl.textContent=cur;
      cdEl.style.color=CDCOLORS[cur];
      cdEl.style.textShadow=`0 0 40px ${CDCOLORS[cur]}, 0 0 80px ${CDCOLORS[cur]}`;
    }
    const t=(fc-nf)/SPN;
    const s=t<0.35?Math.max(1,1.5-1.5*(t/0.35)):1;
    cdEl.style.opacity=1;
    cdEl.style.transform=`translate(-50%,-50%) scale(${s})`;
  } else if(fc===CDEND){
    cdEl.style.opacity=0; curN=null;
    hbEl.style.opacity=1;
    hbEl.style.transform='translate(-50%,-50%) scale(0.4)';
  }
  // HB 弹出-保持-淡出
  if(fc>CDEND && fc<CAKEF){
    const t=fc-CDEND; let sc,op;
    if(t<HBPOP-CDEND){ const p=t/(HBPOP-CDEND); sc=0.4+0.6*(1-Math.pow(1-p,3)); op=1; }
    else if(t<HBHOLD-CDEND){ sc=1+0.02*Math.sin((t-60)*0.2); op=1; }
    else { const p=Math.min(1,(t-(HBHOLD-CDEND))/(HBFADE-HBHOLD)); sc=1+1.2*Math.pow(p,1.5); op=Math.max(0,1-p); }
    hbEl.style.opacity=op;
    hbEl.style.transform=`translate(-50%,-50%) scale(${sc})`;
    if(fc===HBFADE) hbEl.style.opacity=0;
  }
  // 彩带爆破
  if(fc===HBFADE){
    for(const r of ribbons){
      r.pos.set(0,0,3);
      const th=Math.random()*Math.PI*2, ph=Math.acos(Math.random()*2-1), sp=rand(0.08,0.15);
      r.vel.set(sp*Math.sin(ph)*Math.cos(th), sp*Math.sin(ph)*Math.sin(th), sp*Math.cos(ph)*0.9+0.15);
      r.ang.set(rand(0,Math.PI),rand(0,Math.PI),rand(0,Math.PI));
      r.mesh.visible=true; r.mesh.position.copy(r.pos); r.mesh.rotation.copy(r.ang); r.born=fc;
    }
    confetti.visible=true; FALL=true; BSTART=true;
  }
  if(BSTART) for(const r of ribbons){
    if(r.born<0) continue;
    r.vel.z-=GRAV; r.pos.add(r.vel);
    r.ang.x+=r.angVel.x; r.ang.y+=r.angVel.y; r.ang.z+=r.angVel.z;
    r.mesh.position.copy(r.pos); r.mesh.rotation.copy(r.ang);
    if(fc-r.born>800||Math.abs(r.pos.x)>14||Math.abs(r.pos.y)>14||r.pos.z<-5){ r.mesh.visible=false; r.born=-1; }
  }
  if(FALL){
    for(let i=0;i<NC;i++){
      cfPos[i*3]+=cfVel[i*3]; cfPos[i*3+1]+=cfVel[i*3+1]; cfPos[i*3+2]+=cfVel[i*3+2];
      if(cfPos[i*3+2]<-2){
        cfPos[i*3]=rand(-5,5); cfPos[i*3+1]=rand(-5,5); cfPos[i*3+2]=10;
        cfVel[i*3]=rand(-0.01,0.01); cfVel[i*3+1]=rand(-0.01,0.01); cfVel[i*3+2]=-rand(0.015,0.04);
      }
    }
    cfGeo.attributes.position.needsUpdate=true;
  }
  if(fc===CAKEF){
    cakeGroup.visible=true;
    flameOuter.visible=true;
    flameInner.visible=true;
    ROT=true;
  }
  if(ROT){
    cakeGroup.rotation.z+=0.0008;
    const t=fc*0.03;
    flameOuter.scale.setScalar(1+0.006*Math.sin(t*1.5));
    flameInner.scale.setScalar(1+0.010*Math.sin(t*1.8));
  }
  if(fc===CAKEF+600) document.getElementById('replay').classList.add('show');
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
